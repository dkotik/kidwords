<!doctype html>
<html lang="{{ site.Language.Locale | default `en-US` }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if not .IsHome }}{{ .Title }} · {{ end }}{{ site.Title }}</title>
    <link rel="stylesheet" href="{{ `bulma.min.css` | relURL }}">
  </head>
  <body>
    <header class="navbar" role="banner">
      <div class="container">
        <div class="navbar-brand">
          <a class="navbar-item has-text-weight-bold" href="{{ `/` | relURL }}">Kid Words</a>
        </div>
        <nav class="navbar-menu is-active" aria-label="Main navigation">
          <div class="navbar-start">
            {{ range site.Menus.main }}
              <a class="navbar-item{{ if $.IsMenuCurrent `main` . }} is-active{{ end }}" href="{{ .URL | relURL }}">{{ .Name }}</a>
            {{ end }}
          </div>
          <div class="navbar-end">
            <a class="navbar-item" href="https://github.com/dkotik/kidwords" aria-label="Kid Words on GitHub" title="Kid Words on GitHub">
              <span class="icon">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path fill="currentColor" d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.26c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.74.08-.74 1.2.09 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.48.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.66.24 2.88.12 3.18.77.84 1.23 1.91 1.23 3.22 0 4.6-2.8 5.62-5.48 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.58A12 12 0 0 0 12 .5"/>
                </svg>
              </span>
            </a>
          </div>
        </nav>
      </div>
    </header>

    <main class="section">
      <div class="container">
        <div class="columns">
          <aside class="column is-one-quarter">
            <nav class="menu" aria-label="Documentation navigation">
              <p class="menu-label">Documentation</p>
              <ul class="menu-list">
                {{ range site.Menus.main }}
                  <li><a class="{{ if $.IsMenuCurrent `main` . }}is-active{{ end }}" href="{{ .URL | relURL }}">{{ .Name }}</a></li>
                {{ end }}
              </ul>
            </nav>
          </aside>
          <article class="column content">
            {{ block "main" . }}{{ end }}
          </article>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="content has-text-centered">
        <p><strong>Kid Words</strong>, beta documentation.</p>
      </div>
    </footer>
  </body>
</html>
